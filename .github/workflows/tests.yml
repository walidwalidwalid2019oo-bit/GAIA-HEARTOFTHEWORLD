name: GAIA tests

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main", "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run Python tests
        run: python -m pytest -q
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check available website JavaScript
        shell: bash
        run: |
          for file in website/app.js website/entities.js website/access.js; do
            if [ -f "$file" ]; then
              echo "Checking $file"
              node --check "$file"
            fi
          done

  postgres-rate-limit-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gaia
          POSTGRES_PASSWORD: gaia
          POSTGRES_DB: gaia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gaia -d gaia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GAIA_POSTGRES_TEST_URL: postgresql+psycopg://gaia:gaia@localhost:5432/gaia_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Test PostgreSQL rate-limit concurrency
        run: python -m pytest -q tests/test_rate_limit_postgres.py
